<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ovia — Pod Leaderboard</title>

<link rel="icon" id="favicon">
<style>
:root{
  --bg:#0b0e13; --panel:#131820; --panel2:#1a212c; --line:#242d3a; --soft:#1d2531;
  --ink:#e6ebf2; --ink2:#95a1b4; --ink3:#5f6b7d;
  --accent:#3ddc97; --hot:#e0a458; --bar:#3a6ea5;
  --g1:#f5c451; --g2:#c8d0da; --g3:#cd8b52;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}

header{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h1{margin:0;font-size:23px;letter-spacing:-.02em;font-weight:650}
h1 span{color:var(--accent)}
.meta{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{appearance:none;background:none;border:0;color:var(--ink2);font:inherit;font-size:13px;
  padding:6px 16px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--accent);color:#06120c;font-weight:600}
 
.sel{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--ink);font:inherit;font-size:13px;padding:7px 11px;cursor:pointer;
  max-width:340px}
.sel:focus{outline:2px solid var(--accent);outline-offset:1px}
.closed{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);font-size:11px;
  color:var(--ink2);font-family:var(--mono)}

.sub{margin:10px 0 20px;font-size:13px;color:var(--ink2);line-height:1.5}
.sub b{color:var(--ink);font-family:var(--mono)}

 
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:14px;
  margin-bottom:22px}
.pod{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  position:relative;overflow:hidden}
.pod::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--line)}
.pod.r1::before{background:var(--g1)} .pod.r2::before{background:var(--g2)} .pod.r3::before{background:var(--g3)}
.pod .rk{font-size:26px;line-height:1}
.pod .nm{font-size:17px;font-weight:650;margin-top:8px}
.pod .ld{font-size:12px;color:var(--ink3);margin-top:2px}
.pod .big{font-family:var(--mono);font-size:31px;letter-spacing:-.02em;margin:14px 0 2px}
.pod .cap{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.pod .row2{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--soft)}
.pod .row2 div{flex:1}
.pod .row2 b{display:block;font-family:var(--mono);font-size:19px;font-weight:500}

.pace{margin-top:12px}
.pace .lab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:4px}
.pace .lab em{font-style:normal;font-family:var(--mono);color:var(--ink2)}
.track{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}

 
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.card h3{margin:0;padding:13px 16px 11px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink2);border-bottom:1px solid var(--soft);font-weight:600}
.card .body{padding:6px 16px 16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);
  font-weight:600;padding:9px 8px;border-bottom:1px solid var(--soft);white-space:nowrap}
td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--soft);font-family:var(--mono);
  white-space:nowrap}
th:first-child,td:first-child,th.txt,td.txt{text-align:left;font-family:var(--sans)}
tbody tr:last-child td{border-bottom:0}
.exp{display:inline-block;width:14px;color:var(--ink3);cursor:pointer;user-select:none;
  transition:transform .12s}
.exp.open{transform:rotate(90deg);color:var(--accent)}
tr.det td{background:var(--panel2);padding:0}
tr.det table{margin:2px 0 6px}
tr.det th,tr.det td{font-size:12px;padding:6px 8px;border-bottom:1px solid var(--soft)}
.empty{padding:26px 8px;text-align:center;color:var(--ink3);font-size:13px}
.foot{font-size:11.5px;color:var(--ink3);padding:10px 16px 14px;border-top:1px solid var(--soft);
  display:flex;gap:16px;flex-wrap:wrap}
.foot b{color:var(--ink2);font-family:var(--mono)}
.arch{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ac{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ac .k{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.ac .w{font-size:14px;font-weight:600;margin-top:5px}
.ac .w em{font-style:normal;color:var(--g1)}
.ac .l{font-size:11.5px;color:var(--ink3);margin-top:5px;font-family:var(--mono)}
</style>
<div class="wrap">

<header>
  <h1>OVIA <span>POD LEADERBOARD</span></h1>
  <div class="spacer"></div>
  <div class="seg">
    <button data-p="week" class="on">This week</button>
    <button data-p="month">This month</button>
  </div>
  <select class="sel" id="period" aria-label="Which period to show"></select>
</header>
<div class="meta" id="meta">loading…</div>

<div class="sub" id="sub"></div>
<div class="podium" id="podium"></div>

<div class="card">
  <h3>Full standings</h3>
  <div class="body"><div class="tw"><table id="tbl"></table></div></div>
  <div class="foot" id="foot"></div>
</div>


<script>


var D=null, P="week", SEL="", OPEN={};

var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});};
var usd=function(n){return "$"+Math.round(n||0).toLocaleString();};

(function(){
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>"
    +"<rect width='64' height='64' rx='14' fill='#0b0e13'/>"
    +"<rect x='9' y='34' width='12' height='20' rx='2' fill='#c8d0da'/>"
    +"<rect x='26' y='22' width='12' height='32' rx='2' fill='#f5c451'/>"
    +"<rect x='43' y='40' width='12' height='14' rx='2' fill='#cd8b52'/></svg>";
  var el=document.getElementById("favicon");
  if(el) el.href="data:image/svg+xml,"+encodeURIComponent(svg);
})();



function periods(){
  var out=[], cur=D.current&&D.current[P];
  if(cur) out.push({key:cur.key, live:true, p:cur});
  ((P==="week"?D.weeks:D.months)||[]).forEach(function(a){
    if(a&&a.key) out.push({key:a.key, live:false, p:a});
  });
  return out;
}


function chosen(){
  var list=periods();
  if(!list.length) return null;
  var hit=list.filter(function(x){return x.key===SEL;})[0];
  return hit||list[0];
}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONL=["January","February","March","April","May","June","July","August",
          "September","October","November","December"];
var dt_=function(s){return new Date(s+"T12:00:00Z");};

function plabel(x){
  var p=x.p, lab;
  if(P==="month"){ var d=dt_(p.from); lab=MONL[d.getUTCMonth()]+" "+d.getUTCFullYear(); }
  else { var a=dt_(p.from), b=dt_(p.to);
    lab=MON[a.getUTCMonth()]+" "+a.getUTCDate()+" – "+MON[b.getUTCMonth()]+" "+b.getUTCDate(); }
  

  if(x.live) lab+=P==="week"?"  ·  this week":"  ·  this month";
  else if((p.pods||[])[0]) lab+="  ·  "+p.pods[0].name+" won";
  return lab;
}

function fillPeriods(){
  var list=periods(), sel=chosen();
  $("#period").innerHTML=list.map(function(x){
    return '<option value="'+esc(x.key)+'"'+(sel&&x.key===sel.key?' selected':'')+'>'
      +esc(plabel(x))+'</option>';
  }).join("");
  
  $("#period").disabled=list.length<2;
}



function elapsed(w, live){
  var t=new Date(); var today=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")
    +"-"+String(t.getDate()).padStart(2,"0");
  var day=function(s){return new Date(s+"T12:00:00Z").getTime();};
  var total=Math.round((day(w.to)-day(w.from))/864e5)+1;
  if(!live) return {total:total,done:total};
  var done=Math.min(total,Math.max(1,Math.round((day(today)-day(w.from))/864e5)+1));
  return {total:total,done:done};
}

function pace(v,target){
  var pct=target?v/target*100:0;
  var col=pct>=100?"var(--accent)":pct>=70?"var(--bar)":"var(--hot)";
  return '<div class="track"><i style="width:'+Math.min(100,pct)+'%;background:'+col+'"></i></div>';
}

function draw(){
  if(!D){return;}
  fillPeriods();
  var sel=chosen();
  if(!sel){$("#podium").innerHTML='<div class="empty">No data for this period yet.</div>';return;}
  var w=sel.p, live=sel.live;
  var T=D.targets||{conceptsPerWeek:16,spendPerMonth:125000};
  var el=elapsed(w, live);

  

  var fullSpend = P==="week" ? (T.spendPerMonth/30*7) : T.spendPerMonth;
  var fullConc  = P==="week" ? T.conceptsPerWeek : (T.conceptsPerWeek*el.total/7);
  var sT=fullSpend*el.done/el.total, cT=fullConc*el.done/el.total;

  var medal=["🥇","🥈","🥉"];
  $("#podium").innerHTML=w.pods.map(function(p,i){
    return '<div class="pod r'+(i+1)+'">'
      +'<div class="rk">'+(medal[i]||("#"+(i+1)))+'</div>'
      +'<div class="nm">'+esc(p.name)+'</div>'
      +'<div class="ld">'+esc(p.lead||"—")+' · '+esc((p.members||[]).join(", "))+'</div>'
      +'<div class="big">'+usd(p.spend)+'</div>'
      +'<div class="cap">spend</div>'
      +'<div class="pace"><div class="lab"><span>vs pace</span><em>'
        +Math.round(sT?p.spend/sT*100:0)+'%</em></div>'+pace(p.spend,sT)+'</div>'
      +'<div class="row2">'
        +'<div><b>'+p.launched+'</b><span class="cap">concepts launched</span>'
          +'<div class="pace"><div class="lab"><span>vs pace</span><em>'
          +Math.round(cT?p.launched/cT*100:0)+'%</em></div>'+pace(p.launched,cT)+'</div></div>'
        +'<div><b>'+(p.spend&&p.purch?"$"+(p.spend/p.purch).toFixed(0):"—")+'</b>'
          +'<span class="cap">CPA</span></div>'
        +'<div><b>'+(p.spend?(p.value/p.spend).toFixed(2):"—")+'</b><span class="cap">ROAS</span></div>'
      +'</div></div>';
  }).join("");

  var det=function(p){
    if(!p.top||!p.top.length) return '<tr class="det"><td colspan="7"><div class="empty">No spend yet.</div></td></tr>';
    return '<tr class="det"><td colspan="7"><table><thead><tr><th>Top batches</th><th>Spend</th>'
      +'<th>Share</th></tr></thead><tbody>'
      +p.top.map(function(t){return '<tr><td class="txt">'+esc(t.label)+'</td><td>'+usd(t.spend)
        +'</td><td>'+(p.spend?(t.spend/p.spend*100).toFixed(1):"0.0")+'%</td></tr>';}).join("")
      +'</tbody></table></td></tr>';
  };

  var tot=w.pods.reduce(function(a,p){return a+p.spend;},0);
  $("#tbl").innerHTML='<thead><tr><th>#</th><th>Pod</th><th>Spend</th><th>Share</th>'
    +'<th>Concepts</th><th>Live batches</th><th>ROAS</th></tr></thead><tbody>'
   +w.pods.map(function(p){
      var open=!!OPEN[P+"|"+p.id];
      return '<tr><td>'+p.rank+'</td>'
        +'<td class="txt"><span class="exp'+(open?" open":"")+'" data-x="'+esc(P+"|"+p.id)
          +'">▸</span> <b>'+esc(p.name)+'</b> <span style="color:var(--ink3)">'
          +esc(p.lead||"")+'</span></td>'
        +'<td>'+usd(p.spend)+'</td><td>'+(tot?(p.spend/tot*100).toFixed(1):"0.0")+'%</td>'
        +'<td><b>'+p.launched+'</b></td><td>'+p.batches+'</td>'
        +'<td>'+(p.spend?(p.value/p.spend).toFixed(2):"—")+'</td></tr>'
        +(open?det(p):"");
    }).join("")
   +'</tbody>';

  $("#foot").innerHTML='<span>Pods <b>'+usd(tot)+'</b></span>'
    +'<span>Account <b>'+usd(w.acct)+'</b></span>'
    +'<span>Content + unowned <b>'+usd(w.unowned)+'</b></span>'
    +'<span>Closes <b>'+esc(w.closesAt||"")+'</b></span>';

  $("#sub").innerHTML='<b>'+esc(w.from)+'</b> → <b>'+esc(w.to)+'</b> · '
    +(live?('day <b>'+el.done+'</b> of <b>'+el.total+'</b>')
          :('<b>'+el.total+'</b> days, closed'))
    +' · ranked by <b>spend</b>, concepts launched breaks a tie'
    +' · targets <b>'+(T.conceptsPerWeek||16)+'</b> concepts/week and <b>'
    +usd(T.spendPerMonth||125000)+'</b>/month per pod'
    

    +(periods().length<2
        ? ' · history appears here after the first '
          +(P==="week"?'Monday 3am ET rollover':'month closes')
        : '');

  

  var u=D.updated?new Date(D.updated):null;
  var mins=u?Math.round((Date.now()-u.getTime())/60000):null;
  $("#meta").innerHTML = live
    ? esc("updated "+(mins==null?"—":(mins<1?"just now":mins+" min ago"))
        +(u?"  ·  "+u.toLocaleString():"")+"  ·  refreshes hourly")
    : esc("closed "+w.to)+' <span class="closed">FINAL</span>';
}

document.addEventListener("click",function(e){
  var b=e.target.closest("[data-p]");
  if(b){P=b.getAttribute("data-p");
    
    
    SEL="";
    document.querySelectorAll("[data-p]").forEach(function(x){
      x.classList.toggle("on",x.getAttribute("data-p")===P);});
    draw();return;}
  var x=e.target.closest("[data-x]");
  if(x){var k=x.getAttribute("data-x");OPEN[k]=!OPEN[k];draw();}
});

document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="period"){ SEL=e.target.value; OPEN={}; draw(); }
});

function load(){
  fetch("./leaderboard.json",{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(d){D=d;draw();})
    .catch(function(e){
      $("#meta").textContent="could not load leaderboard.json ("+e.message+")";
      $("#podium").innerHTML='<div class="empty">No data yet. Run leaderboardPull() in the '
        +'Ovia Master OS Apps Script project.</div>';});
}
load();
setInterval(load,5*60*1000);   
</script>
</div>
